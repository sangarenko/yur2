  <script>
    (function () {
      if (typeof window === 'undefined' || !window.fetch) return;
      function normPath(p) {
        var s = String(p || '/').replace(/\/{2,}/g, '/');
        return s || '/';
      }
      function isApiPathUrl(urlStr) {
        try {
          var u = urlStr.charAt(0) === '/'
            ? new URL(urlStr, window.location.origin)
            : new URL(urlStr);
          var path = normPath(u.pathname);
          return path === '/api' || path.indexOf('/api/') === 0;
        } catch (e) {
          return false;
        }
      }
      function urlFromInput(input) {
        if (typeof input === 'string') return input;
        if (typeof URL !== 'undefined' && input instanceof URL) return input.href;
        if (typeof Request !== 'undefined' && input instanceof Request) return input.url;
        return '';
      }
      var nativeFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        var urlStr = urlFromInput(input);
        if (!urlStr || !isApiPathUrl(urlStr)) return nativeFetch(input, init);
        var o = init ? Object.assign({}, init) : {};
        o.credentials = 'omit';
        o.referrerPolicy = 'no-referrer';
        if (typeof Request !== 'undefined' && input instanceof Request) {
          return nativeFetch(new Request(input, o));
        }
        return nativeFetch(input, o);
      };
    })();

  <script>
    (function () {
      function isNewsUrl(value) {
        try {
          var url = new URL(value, location.href);
          return url.origin === location.origin &&
            (url.pathname === '/news' || url.pathname.indexOf('/news/') === 0);
        } catch (e) {
          return false;
        }
      }

      if (isNewsUrl(location.href)) {
        location.replace('/');
        return;
      }

      function hideNewsLinks() {
        document.querySelectorAll('a[href]').forEach(function (link) {
          if (isNewsUrl(link.href)) {
            link.hidden = true;
            link.setAttribute('aria-hidden', 'true');
            link.setAttribute('tabindex', '-1');
          }
        });
      }

      document.addEventListener('click', function (event) {
        var link = event.target && event.target.closest
          ? event.target.closest('a[href]')
          : null;
        if (!link || !isNewsUrl(link.href)) return;
        event.preventDefault();
        event.stopPropagation();
        location.assign('/');
      }, true);

      ['pushState', 'replaceState'].forEach(function (methodName) {
        var nativeMethod = history[methodName];
        history[methodName] = function () {
          if (arguments[2] && isNewsUrl(arguments[2])) {
            location.assign('/');
            return;
          }
          var result = nativeMethod.apply(this, arguments);
          hideNewsLinks();
          return result;
        };
      });

      document.addEventListener('DOMContentLoaded', hideNewsLinks);
      new MutationObserver(hideNewsLinks).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
    })();
  </script>

  <script>
    // В шапке NotesPanel рендерит кликабельной только иконку, а подпись —
    // отдельним соседним span. Делегируем подпись той же кнопке открытия.
    (function () {
      function getNotesLabel(target) {
        if (!(target instanceof Element)) return null;
        var label = target.closest('span');
        if (!label || label.textContent.trim() !== 'Заметки') return null;
        var container = label.parentElement;
        return container && container.querySelector('button') ? label : null;
      }

      document.addEventListener('click', function (event) {
        if (!(event.target instanceof Element)) return;
        var container = event.target.closest('[data-notes-trigger]');
        if (!container || event.target.closest('button')) return;
        container.querySelector('button').click();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        var label = getNotesLabel(event.target);
        if (!label) return;
        event.preventDefault();
        label.parentElement.querySelector('button').click();
      });

      function markNotesLabel() {
        document.querySelectorAll('span').forEach(function (label) {
          if (getNotesLabel(label)) {
            label.style.cursor = 'pointer';
            label.setAttribute('role', 'button');
            label.setAttribute('tabindex', '0');
            label.parentElement.setAttribute('data-notes-trigger', '');
          }
        });
      }

      new MutationObserver(markNotesLabel).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
      document.addEventListener('DOMContentLoaded', markNotesLabel);
    })();
  </script>
  <script>
    (function () {
      function closeVoiceBalanceModal() {
        var modal = document.querySelector('.voice-balance-modal');
        if (modal) modal.remove();
      }

      function showVoiceBalanceModal(detail) {
        closeVoiceBalanceModal();

        var modal = document.createElement('div');
        modal.className = 'voice-balance-modal';
        modal.setAttribute('role', 'dialog');
        modal.setAttribute('aria-modal', 'true');
        modal.setAttribute('aria-labelledby', 'voice-balance-title');
        modal.innerHTML =
          '<div class="voice-balance-modal__card">' +
            '<div class="voice-balance-modal__icon">₽</div>' +
            '<h2 id="voice-balance-title" class="voice-balance-modal__title">Недостаточно средств</h2>' +
            '<p class="voice-balance-modal__message"></p>' +
            '<div class="voice-balance-modal__actions">' +
              '<button type="button" class="voice-balance-modal__button voice-balance-modal__button--cancel">Закрыть</button>' +
              '<button type="button" class="voice-balance-modal__button voice-balance-modal__button--topup">Пополнить баланс</button>' +
            '</div>' +
          '</div>';

        modal.querySelector('.voice-balance-modal__message').textContent =
          detail && detail.message
            ? detail.message
            : 'Баланс закончился. Пополните его, чтобы продолжить голосовой разговор.';
        modal.querySelector('.voice-balance-modal__button--cancel').onclick = closeVoiceBalanceModal;
        modal.querySelector('.voice-balance-modal__button--topup').onclick = function () {
          window.location.href = '/dashboard?topup=1';
        };
        modal.onclick = function (event) {
          if (event.target === modal) closeVoiceBalanceModal();
        };
        document.body.appendChild(modal);
        modal.querySelector('.voice-balance-modal__button--topup').focus();
      }

      window.addEventListener('voice-insufficient-balance', function (event) {
        showVoiceBalanceModal(event.detail || {});
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeVoiceBalanceModal();
      });

      function openTopupFromUrl() {
        if (new URLSearchParams(window.location.search).get('topup') !== '1') return;

        var observer = new MutationObserver(function () {
          var button = Array.from(document.querySelectorAll('button')).find(function (item) {
            return item.textContent.trim() === 'Пополнить';
          });
          if (!button) return;

          observer.disconnect();
          button.click();
          window.history.replaceState({}, '', '/dashboard');
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        setTimeout(function () { observer.disconnect(); }, 10000);
      }

      document.addEventListener('DOMContentLoaded', openTopupFromUrl);
    })();

  <script>
    (function () {
      var initialized = false;

      function showVkError(container, error) {
        console.error('[VK ID]', error);
        var message = container.parentElement.querySelector('.vk-id-oauth-error');
        if (!message) {
          message = document.createElement('p');
          message.className = 'vk-id-oauth-error';
          container.insertAdjacentElement('afterend', message);
        }
        message.textContent = 'Не удалось войти через VK ID. Попробуйте ещё раз.';
      }

      async function finishVkLogin(container, data) {
        var accessToken = data && (data.access_token || data.accessToken);
        if (!accessToken) throw new Error('VK ID did not return an access token');

        var response = await fetch('/api/auth/vk/sdk-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: accessToken })
        });
        var result = await response.json();
        if (!response.ok || !result.token) {
          throw new Error(result.error || 'VK token exchange failed');
        }
        window.location.href = '/chat?token=' + encodeURIComponent(result.token);
      }

      function initializeVkSdk() {
        if (!('VKIDSDK' in window)) return false;
        if (initialized) return true;

        var VKID = window.VKIDSDK;
        VKID.Config.init({
          app: 54700354,
          redirectUrl: 'https://lawyer.windexs.ru/api/auth/vk/callback',
          responseMode: VKID.ConfigResponseMode.Callback,
          source: VKID.ConfigSource.LOWCODE,
          scope: 'email'
        });
        initialized = true;
        return true;
      }

      // Если SDK не загрузился (блокировщик, сеть), показываем обычную кнопку
      // на серверный OAuth: он работает без стороннего скрипта.
      function renderVkFallbackButton(anchorButton) {
        var fallback = document.createElement('button');
        fallback.type = 'button';
        fallback.className = anchorButton.className;
        fallback.style.marginTop = '0.75rem';
        fallback.textContent = 'Войти через VK ID';
        fallback.onclick = function () {
          window.location.href = '/api/auth/vk/login';
        };
        anchorButton.insertAdjacentElement('afterend', fallback);
      }

      function renderVkOAuthLists() {
        var sdkReady = initializeVkSdk();
        var VKID = window.VKIDSDK;

        document.querySelectorAll('button').forEach(function (yandexButton) {
          var text = yandexButton.textContent.trim();
          if (text !== 'Войти через Яндекс' && text !== 'Зарегистрироваться через Яндекс') return;
          if (yandexButton.dataset.vkWidgetAdded) return;

          if (!sdkReady) {
            if (document.readyState !== 'complete') return;
            yandexButton.dataset.vkWidgetAdded = '1';
            renderVkFallbackButton(yandexButton);
            return;
          }

          yandexButton.dataset.vkWidgetAdded = '1';

          var container = document.createElement('div');
          container.className = 'vk-id-oauth-container';
          yandexButton.insertAdjacentElement('afterend', container);

          var oneTap = new VKID.OneTap();
          oneTap.render({
            container: container,
            showAlternativeLogin: true,
            oauthList: ['mail_ru', 'ok_ru'],
            styles: { borderRadius: 8, height: 44 }
          })
          .on(VKID.WidgetEvents.ERROR, function (error) {
            showVkError(container, error);
          })
          .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
            VKID.Auth.exchangeCode(payload.code, payload.device_id)
              .then(function (data) { return finishVkLogin(container, data); })
              .catch(function (error) { showVkError(container, error); });
          });
        });
      }

      new MutationObserver(renderVkOAuthLists).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
      window.addEventListener('load', renderVkOAuthLists);
      document.addEventListener('DOMContentLoaded', renderVkOAuthLists);
      setInterval(renderVkOAuthLists, 1000);
    })();
  </script>
